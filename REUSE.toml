version = 1
SPDX-PackageName = "Cosmos-H-Dreams"
SPDX-PackageSupplier = "NVIDIA Corporation <isaac-for-healthcare@nvidia.com>"
SPDX-PackageDownloadLocation = "https://github.com/isaac-for-healthcare/Cosmos-H-Dreams"

# Files in this repository that do not (or cannot reasonably) carry a per-file
# SPDX header are licensed via this manifest, per REUSE 3.3.
#
# All first-party Cosmos-H-Dreams source (cosmosHDreams/) and the vendored
# FlashDreams subtree (flashdreams/) are Apache-2.0; per-file SPDX headers are
# the authoritative source for files that carry them, and the table below
# fills the gaps for config, build, asset, and documentation files where an
# inline header would be intrusive or break tooling.
#
# Third-party dependencies are NOT declared here: they are consumed at
# runtime through Python's import system (no source redistribution). Their
# attributions live in NOTICE and THIRD-PARTY-NOTICES.

# --- Default: every other file in the repo is NVIDIA-authored Apache-2.0 ---
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# --- Documentation files ---
[[annotations]]
path = ["**.md", "**.rst", "docs/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# --- Configuration / build / CI / shell scripts ---
[[annotations]]
path = [
    ".github/**",
    ".pre-commit-config.yaml",
    ".pre-commit-config-base.yaml",
    ".gitignore",
    ".gitattributes",
    "pyproject.toml",
    "uv.lock",
    "docker/**",
    "tests/run_tests_*.sh",
    "assets/*.sh",
    "skills/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# --- Binary assets (images, video clips, model snapshots, lock files) carry
#     no inline header. They are NVIDIA-authored unless otherwise noted in
#     NOTICE. ---
[[annotations]]
path = [
    "assets/**.png",
    "assets/**.jpg",
    "assets/**.jpeg",
    "assets/**.webp",
    "assets/**.mp4",
    "assets/**.gif",
    "assets/**.svg",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"

# --- flashdreams/ vendored subtree. Sourced from NVIDIA FlashDreams
#     (https://github.com/NVIDIA/flashdreams); NVIDIA-authored, Apache-2.0.
#     Local modifications are tracked in this repository's git history. ---
[[annotations]]
path = "flashdreams/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright (c) 2026 NVIDIA CORPORATION & AFFILIATES. All rights reserved."
SPDX-License-Identifier = "Apache-2.0"
