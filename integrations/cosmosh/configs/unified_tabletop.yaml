# Unified server — keyboard + Quest on one port, one rollout.
# Whichever side connects most recently drives; the other side's
# connection is closed automatically (takeover semantics).
#
# Run with:
#   uv run --package flash-cosmosh python -m cosmosh.webrtc.server_unified \
#     --config integrations/cosmosh/configs/unified_tabletop.yaml
#
# URLs once running (HTTPS on the port below):
#   /                  landing page with links
#   /keyboard          keyboard demo (browser, WebRTC)
#   /quest             Quest demo (open in Quest browser, WebXR)
#   /viewer            spectator MJPEG view

runtime:
  config_name: vae_vae
  compile_network: true
  device: cuda:0
  seed: 1
  ckpt_path: checkpoints/jhu/tabletop/model_ema_bf16_jhutabletop_288x512.pt
  resolution: [288, 512]
  fps: 30
  actions_per_chunk: 8  # 4 / 8 / 12 / 16…; smaller = lower latency, lower fidelity

scenes:
  - name: suturebot_001867
    input_path: sf_inference_data/260206/suturebot_inference_data/episode_001867.mp4
    stats_path: sf_inference_data/260206/stats_cosmos.json
    cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt
    start_frame_idx: 0
  - name: suturebot_001866
    input_path: sf_inference_data/260206/suturebot_inference_data/episode_001866.mp4
    stats_path: sf_inference_data/260206/stats_cosmos.json
    cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt
    start_frame_idx: 0
  - name: suturebot_001868
    input_path: sf_inference_data/260206/suturebot_inference_data/episode_001868.mp4
    stats_path: sf_inference_data/260206/stats_cosmos.json
    cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt
    start_frame_idx: 0

# Keyboard-driver tuning. Read only when someone drives via the browser
# (/keyboard). Ignored by the Quest path.
keyboard:
  translate_v_per_frame: 0.1
  gripper_v_per_chunk: 1.0
  rotate_deg_per_frame: 1.0
  light_mode: false

# Quest-driver tuning. Read only when someone drives via WebXR (/quest).
# Ignored by the keyboard path.
vr:
  translate_scale:
    right: [250.0, 800.0, 250.0]
    left:  [250.0, 800.0, 250.0]
  rotate_scale: 9.0
  body_relative_translate: true
  body_relative_rotation: true
  display:
    width_m: 1
    height_m: 0.75
    distance_m: 1.2

video:
  jpeg_quality: 85

# HTTPS required because WebXR (Quest) refuses to start on non-localhost
# origins without TLS. The keyboard demo works fine over HTTPS too —
# clients just have to accept the self-signed-cert warning once.
server:
  host: 0.0.0.0
  port: 8443
  cert: cert.pem
  key: key.pem
