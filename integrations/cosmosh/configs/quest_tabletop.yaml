# Quest server — suturebot episode 001867 + chole scenes.
# Switch live from the /quest page's "Scene:" dropdown.
#
# Run with:
#   uv run --package flash-cosmosh python -m cosmosh.webrtc.server_quest \
#     --config integrations/cosmosh/configs/quest_tabletop.yaml

runtime:
  config_name: cosmosh-chunk3-vae-lighttae
  compile_network: true
  device: cuda:0
  seed: 1
  ckpt_path: checkpoints/jhu/tabletop/model_ema_bf16_jhutabletop_288x512_h73.pt  # null → AVAILABLE_COSMOSH_CHECKPOINT_PATHS["default"]
  resolution: [288, 512]
  fps: 30
  # Generated frames per outer block. Must be a positive multiple of the
  # pipeline's num_action_per_latent_frame (usually 4, so 4 / 8 / 12 / 16…).
  # 12 matches training; smaller = shorter latency, lower fidelity.
  actions_per_chunk: 12

# Light-switch contract: model (config_name / ckpt_path / resolution /
# actions_per_chunk) is shared across scenes — only the conditional input,
# action stats, and CR1 embeddings change at switch time. First scene below
# is the one the runtime boots into.
scenes:
  - name: suturebot_001867
    input_path: sf_inference_data/260206/suturebot_inference_data/episode_001867.mp4
    stats_path: sf_inference_data/260206/stats_cosmos.json
    cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt
    start_frame_idx: 0
  - name: suturebot_001866
    input_path: sf_inference_data/260206/suturebot_inference_data/episode_001866.mp4
    stats_path: sf_inference_data/260206/stats_cosmos.json
    cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt
    start_frame_idx: 0
  - name: suturebot_001868
    input_path: sf_inference_data/260206/suturebot_inference_data/episode_001868.mp4
    stats_path: sf_inference_data/260206/stats_cosmos.json
    cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt
    start_frame_idx: 0

vr:
  # translate_scale: per-axis play-space scaling applied before the
  # camera-frame remap. Three accepted shapes:
  #   - scalar                          → all axes, both arms
  #   - [x, y, z]                       → per axis, shared across arms
  #   - {right: <s|3-vec>, left: <s|3-vec>}   → asymmetric per arm
  # translate_scale: [250.0, 800.0, 250.0]
  translate_scale:
    right: [250.0, 800.0, 250.0]
    left:  [250.0, 800.0, 250.0]
  # rotate_scale: scalar (shared) or {right, left} dict (asymmetric).
  rotate_scale: 9.0
  # rotate_scale: {right: 9.0, left: 9.0}
  # Input semantics (default false = absolute play-space; see QUEST_PLAN.md).
  # body_relative_translate: rotate dpos by -headset_yaw before sending,
  #   so "push forward" follows the user's heading rather than the
  #   play-space initial direction.
  # body_relative_rotation: send conj(prev)·curr instead of curr·conj(prev),
  #   so wrist rotation deltas are expressed in the controller's own
  #   previous frame.
  body_relative_translate: true
  body_relative_rotation: true
  # In-headset display panel — the floating "monitor" you see in VR.
  # Aspect should ideally match runtime.resolution (here 288x512 ≈ 9:16
  # so a 16:9-ish panel reads correctly). Defaults: 0.4 × 0.3 m @ 1.2 m.
  display:
    width_m: 1
    height_m: 0.75
    distance_m: 1.2
  video_transport: webrtc

video:
  # Quest MJPEG sink quality (unchanged).
  jpeg_quality: 85

  # Keyboard / WebRTC path: encode via NVIDIA NVENC. Falls back to
  # cpu_libav automatically on hosts without PyNvVideoCodec + CUDA.
  # Override per-launch with --encoder cpu_libav.
  encoder: auto
  nvenc:
    preset: P3
    tuning: ultra_low_latency
    bitrate: 3000000        # bits per second
    idr_period_s: 4.0       # seconds between forced IDR frames

server:
  host: 0.0.0.0
  port: 8443
  cert: cert.pem  # WebXR requires TLS on non-localhost origins
  key: key.pem
