# Keyboard server — CMR hysterectomy experiment 6 (unified runner naming).
#
# Run with:
#   uv run --package flash-cosmosh python -m cosmosh.webrtc.server \
#     --config integrations/cosmosh/configs/keyboard_cmr_hyst_exp6.yaml

runtime:
  config_name: cosmosh-chunk3-vae-vae
  compile_network: true
  device: cuda:0
  seed: 1
  ckpt_path: checkpoints/cmr/hysterectomy/model_ema_bf16_cmr_hyst_exp6_h73.pt
  resolution: [288, 512]
  fps: 30
  window_size_t: 11
  use_cuda_graph: false
  actions_per_chunk: 12  # 4 / 8 / 12 / 16…; smaller = lower latency, lower fidelity

# Light-switch contract: the model (config_name / ckpt_path / resolution /
# actions_per_chunk) is shared across scenes — only the conditional input,
# action stats, and CR1 embeddings change at switch time. First scene below
# is the one the runtime boots into.
scenes:
  - name: cmr_hyst_exp5_003
    input_path: sf_inference_data/cmr/frames/first_frame_000_vidx03690857_ep007470_b00001615.png
    stats_path: sf_inference_data/cmr/stats_cosmos-28D-exp1.json
    cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt
  - name: cmr_hyst_exp5_001
    input_path: sf_inference_data/cmr/frames/hyst/first_frame_001_vidx00024280_ep000239_b00001453.png
    stats_path: sf_inference_data/cmr/stats_cosmos-28D-exp1.json
    cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt
  - name: cmr_hyst_exp5_002
    input_path: sf_inference_data/cmr/frames/hyst/first_frame_003_vidx00729261_ep006328_b00001347.png
    stats_path: sf_inference_data/cmr/stats_cosmos-28D-exp1.json
    cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt


vr:
  # translate_scale: per-axis play-space scaling applied before the
  # camera-frame remap. Three accepted shapes:
  #   - scalar                          → all axes, both arms
  #   - [x, y, z]                       → per axis, shared across arms
  #   - {right: <s|3-vec>, left: <s|3-vec>}   → asymmetric per arm
  # translate_scale: [250.0, 800.0, 250.0]
  translate_scale:
    right: [250.0, 800.0, 250.0]
    left:  [250.0, 800.0, 250.0]
  # rotate_scale: scalar (shared) or {right, left} dict (asymmetric).
  rotate_scale: 9.0
  # rotate_scale: {right: 9.0, left: 9.0}
  # Input semantics (default false = absolute play-space; see QUEST_PLAN.md).
  # body_relative_translate: rotate dpos by -headset_yaw before sending,
  #   so "push forward" follows the user's heading rather than the
  #   play-space initial direction.
  # body_relative_rotation: send conj(prev)·curr instead of curr·conj(prev),
  #   so wrist rotation deltas are expressed in the controller's own
  #   previous frame.
  body_relative_translate: true
  body_relative_rotation: true
  # In-headset display panel — the floating "monitor" you see in VR.
  # Aspect should ideally match runtime.resolution (here 288x512 ≈ 9:16
  # so a 16:9-ish panel reads correctly). Defaults: 0.4 × 0.3 m @ 1.2 m.
  display:
    width_m: 1
    height_m: 0.75
    distance_m: 1.2

video:
  jpeg_quality: 85

server:
  host: 0.0.0.0
  port: 8443
  cert: cert.pem  # WebXR requires TLS on non-localhost origins
  key: key.pem
