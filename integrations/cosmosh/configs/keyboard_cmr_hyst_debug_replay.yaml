# Keyboard server — DEBUG action-override replay.
#
# Streams the model output for a RECORDED action trajectory + first frame
# straight to the browser, ignoring live keyboard input. The output should
# match the offline runner / `python -m cosmosh.webrtc.replay` for the same
# episode — use it to confirm whether the interactive divergence lives in the
# action computation (keyboard integrator) rather than the GPU pipeline.
#
# Run with:
#   uv run --package flash-cosmosh python -m cosmosh.webrtc.server \
#     --config integrations/cosmosh/configs/keyboard_cmr_hyst_debug_replay.yaml
# then open http://<host>:8080/keyboard — the rollout plays automatically.

runtime:
  config_name: cosmosh-chunk3-vae-vae
  compile_network: true
  device: cuda:0
  seed: 1
  ckpt_path: checkpoints/cmr/hyst/model_ema_bf16_cmr_hyst_exp5_iter2600.pt
  resolution: [288, 512]
  fps: 10
  actions_per_chunk: 12
  # Debug: replay these recorded actions (first frame comes from input_path
  # below), ignoring live keyboard input.
  debug_action_npy: sf_inference_data/cmr/trajectories/hyst_exp4_test/episodes/episode_007193_actions.npy

scenes:
  - name: episode_007193
    input_path: sf_inference_data/cmr/trajectories/hyst_exp4_test/episodes/episode_007193.mp4
    stats_path: sf_inference_data/cmr/stats_cosmos-28D-exp1.json
    cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt
    start_frame_idx: 0

keyboard:
  light_mode: false   # ignored in debug-override mode (loop runs continuously)

server:
  host: 0.0.0.0
  port: 8080
