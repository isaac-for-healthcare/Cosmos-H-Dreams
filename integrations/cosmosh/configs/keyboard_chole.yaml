# Keyboard server — chole still image with the JHU/Chole checkpoint.
# Reproduces the second invocation from README.md.
#
# Run with:
#   uv run --package flash-cosmosh python -m cosmosh.webrtc.server \
#     --config integrations/cosmosh/configs/keyboard_chole.yaml

runtime:
  config_name: 2steps_vae_lighttae
  compile_network: true
  device: cuda:0
  seed: 1
  ckpt_path: checkpoints/model_ema_jhuchole_bf16.pt
  cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt
  input_path: sf_inference_data/chole/chole_frame0.png
  stats_path: sf_inference_data/260206/stats_cosmos_chole.json
  resolution: [288, 512]
  fps: 30
  actions_per_chunk: 12  # 4 / 8 / 12 / 16…; smaller = lower latency, lower fidelity

keyboard:
  translate_v_per_frame: 0.1
  gripper_v_per_chunk: 1.0
  rotate_deg_per_frame: 1.0
  light_mode: false

server:
  host: 0.0.0.0
  port: 8080
