# Keyboard server — suturebot episode 001867 + chole scenes.
# Switch live from the UI's "Scene:" dropdown.
#
# Run with:
#   uv run --package flash-cosmosh python -m cosmosh.webrtc.server \
#     --config integrations/cosmosh/configs/keyboard_tabletop.yaml

runtime:
  config_name: 2steps_vae_lighttae
  compile_network: true
  device: cuda:0
  seed: 1
  ckpt_path: checkpoints/cmr/prostatectomy/model_ema_bf16_cmr_prostatectomy_288x512.pt
  resolution: [288, 512]
  fps: 30
  actions_per_chunk: 12  # 4 / 8 / 12 / 16…; smaller = lower latency, lower fidelity

# Light-switch contract: the model (config_name / ckpt_path / resolution /
# actions_per_chunk) is shared across scenes — only the conditional input,
# action stats, and CR1 embeddings change at switch time. First scene below
# is the one the runtime boots into.
scenes:
  - name: cmr_prost_004
    input_path: sf_inference_data/cmr/frames/first_frame_004_vidx03869938_ep007803_b00002627.png
    stats_path: sf_inference_data/cmr/stats_cosmos-28D-exp1.json
    cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt
  - name: cmr_prost_006
    input_path: sf_inference_data/cmr/frames/first_frame_006_vidx04911431_ep009627_b00001170.png
    stats_path: sf_inference_data/cmr/stats_cosmos-28D-exp1.json
    cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt
  - name: cmr_prost_015
    input_path: sf_inference_data/cmr/frames/first_frame_015_vidx02750448_ep005568_b00001186.png
    stats_path: sf_inference_data/cmr/stats_cosmos-28D-exp1.json
    cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt
  - name: cmr_prost_020
    input_path: sf_inference_data/cmr/frames/first_frame_020_vidx00886756_ep001603_b00002486.png
    stats_path: sf_inference_data/cmr/stats_cosmos-28D-exp1.json
    cr1_embeddings_path: sf_inference_data/cr1_empty_string_text_embeddings.pt

keyboard:
  translate_v_per_frame: 0.1   # σ/frame; 0.1 ≈ 2.3 mm/s on PSM1 at fps=10
  gripper_v_per_chunk: 1.0     # σ/chunk while open/close key held
  rotate_deg_per_frame: 1.0    # degrees/frame while a rotation key held
  light_mode: false            # true = render only while input is held

server:
  host: 0.0.0.0
  port: 8080
