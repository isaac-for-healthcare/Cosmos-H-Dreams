[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flash-cosmosh"
version = "0.1.0"
description = "Cosmosh WebRTC integration for flashdreams"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flashdreams",
    "aiohttp>=3.9",
    "aiortc>=1.9",
    "opencv-python-headless",
    "mediapy",
    "pyyaml>=6.0",
]

[tool.uv.sources]
flashdreams = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cosmosh*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"cosmosh.webrtc" = ["web/*.html", "web/*.css", "web/*.js"]
